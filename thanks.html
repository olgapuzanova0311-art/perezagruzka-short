<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Выбери канал — ИИ: Перезагрузка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@700;800;900&family=Jost:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0B0C0A;--surface:#14160F;--lime:#C2F04B;--bone:#ECEFE7;--mute:#9CA394;--ink:#0B0C0A;
  --disp:'Montserrat',sans-serif;--sans:'Jost',sans-serif;}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--bone);font-family:var(--sans);min-height:100vh;
  display:flex;align-items:center;justify-content:center;padding:24px}
.wrap{max-width:560px;width:100%;text-align:center}
.tag{display:inline-block;background:var(--lime);color:var(--ink);border-radius:100px;
  padding:8px 16px;font-weight:600;font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin-bottom:22px}
h1{font-family:var(--disp);font-weight:900;text-transform:uppercase;letter-spacing:-.02em;
  font-size:clamp(26px,5vw,38px);line-height:1.15;margin-bottom:14px;color:var(--bone)}
p{color:var(--mute);font-size:16px;line-height:1.5;margin-bottom:34px}
.btns{display:grid;gap:16px}
.ch{display:flex;align-items:center;gap:16px;border-radius:16px;padding:20px 24px;text-decoration:none;
  font-family:var(--disp);font-weight:800;font-size:19px;color:#fff;transition:transform .15s ease}
.ch:hover{transform:translateY(-3px)}
.ch img{width:44px;height:44px;border-radius:12px;flex:0 0 auto}
.ch.tg{background:linear-gradient(135deg,#2AABEE,#229ED9)}
.ch.max{background:linear-gradient(135deg,#6A4CF5,#8A3FF5)}
.note{margin-top:26px;font-size:13px;color:var(--mute)}
</style>
</head>
<body>
<div class="wrap">
  <span class="tag">Заявка принята</span>
  <h1>Выбери, где удобнее получать новости</h1>
  <p>Там же пришлём 69 промптов, программу и ссылки на эфиры 15, 16 и 17 сентября.</p>
  <div class="btns">
    <a class="ch tg" id="chTg" href="https://t.me/+cjxoa6weO0czOWRi" target="_blank" rel="noopener">
      <img src="img/3aac49ab3060.png" alt="Telegram">
      Присоединиться в Telegram
    </a>
    <a class="ch max" id="chMax" href="https://max.ru/join/m1LhDS14J28-gGYVDAY2zsOB-7r4q5xJ2YaxP60Fn0A" target="_blank" rel="noopener">
      <img src="img/85c749bb6d70.png" alt="MAX">
      Присоединиться в MAX
    </a>
  </div>
  <div class="note">Можно нажать обе, если пользуешься и тем и другим.</div>
</div>
<script>
(function(){
  var SHEET_URL = 'https://script.google.com/macros/s/AKfycbxsbRPa_v5y4gUsBWQA0qInIZBW5U6zoohu0R7xH5j0J-whPFLgE_zzvsZC7mEX-8u2/exec';
  var chosen = false;
  var params = new URLSearchParams(location.search);
  var visitorName = params.get('name') || '';
  var visitorPhone = params.get('phone') || '';
  var visitorTariff = params.get('tariff') || '';

  function sendToSheet(payload){
    if(!SHEET_URL) return;
    var body = JSON.stringify(payload);
    if(navigator.sendBeacon){
      try{
        navigator.sendBeacon(SHEET_URL, new Blob([body], {type:'text/plain;charset=utf-8'}));
        return;
      }catch(e){}
    }
    try{
      fetch(SHEET_URL, {method:'POST', mode:'no-cors', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: body, keepalive:true});
    }catch(e){}
  }

  document.getElementById('chTg').addEventListener('click', function(){
    chosen = true;
    sendToSheet({event:'Выбор канала', name:visitorName, phone:visitorPhone, tariff:visitorTariff, channel:'Telegram', page: location.href});
  });
  document.getElementById('chMax').addEventListener('click', function(){
    chosen = true;
    sendToSheet({event:'Выбор канала', name:visitorName, phone:visitorPhone, tariff:visitorTariff, channel:'MAX', page: location.href});
  });

  document.addEventListener('visibilitychange', function(){
    if(document.visibilityState === 'hidden' && !chosen){
      chosen = true; // отправляем только один раз
      sendToSheet({event:'НЕ ДОШЁЛ', name:visitorName, phone:visitorPhone, tariff:visitorTariff, channel:'', page: location.href});
    }
  });
  window.addEventListener('pagehide', function(){
    if(!chosen){
      chosen = true;
      sendToSheet({event:'НЕ ДОШЁЛ', name:visitorName, phone:visitorPhone, tariff:visitorTariff, channel:'', page: location.href});
    }
  });
})();
</script>
</body>
</html>
